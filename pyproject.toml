[project]
name = "ide-mcp"
version = "0.2.0"
description = "IDE-free MCP servers: one for files and search, one for Gradle, detekt, ktlint and Kotlin/Java symbols."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
]

[project.scripts]
files-mcp = "ide_mcp.files_server:main"
kotlin-mcp = "ide_mcp.kotlin_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ide_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
